name: Scan (oeffentlich)

on:
  schedule:
    # Stuendlich (Minute 47). Oeffentliche Repos haben unbegrenzte Actions-Minuten.
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-run.txt

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-run.txt

      - name: Scan und Tagesbericht (nur Papierhandel, nur oeffentliche Daten)
        # --no-snapshots: Deribit-Rohdaten werden im oeffentlichen Repo nie gespeichert.
        run: python -m scanner.run daily --data-dir data --no-snapshots

      - name: Ergebnisse committen
        # data/snapshots/ ist in .gitignore. Bei einem dazwischen gepushten Commit erneut versuchen.
        run: |
          git config user.name "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push fehlgeschlagen (Versuch $i/5), hole main und versuche erneut ..."
            git pull --rebase origin main
            sleep 3
          done
          echo "Push nach 5 Versuchen fehlgeschlagen." >&2
          exit 1
