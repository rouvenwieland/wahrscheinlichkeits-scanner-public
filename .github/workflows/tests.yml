name: Tests

on:
  push:
    # Die Commits des Scan-Bots aendern nur data/; dafuer keine Testlaeufe (spart Minuten).
    paths-ignore: ["data/**", "docs/**", "**.md"]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
